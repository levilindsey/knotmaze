<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>k1362s3</title>
<body style="margin:0;background:#111;color:#ccc;font:12px monospace">
<pre id="log">k1362s3 bench</pre>
<script type="module">
// K1362 s3: loads the bundled bench (k1362s3_entry.ts) and exposes it; k1362s3_run.mjs (desktop) and
// k1362s3_phone.mjs (the Pixel's pass tab) start a run with window.__start(kind, args) and poll window.__res.
import { bench, drag } from "./k1362s3_bundle.mjs";
window.__res = null; window.__err = null;
window.__start = (kind, args) => {
  window.__res = null; window.__err = null;
  const p = kind === "drag" ? drag(...args) : bench(args);
  p.then((r) => { window.__res = r; }, (e) => { window.__err = String(e && e.stack || e); });
  return true;
};
window.__ready = true;
</script>
