<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the canvas runs edge to edge under notches;
         the HUD, menu button and panel offset by env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Relative: the levi.dev proxy serves this under /knotmaze/. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#151b28" />
    <title>KnotMaze</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        background: #fafaf8;
        /* No long-press text selection / callout / tap flash on touch. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      canvas {
        display: block;
      }
      /* K546 stage 3: the loss vignette — a plain CSS overlay the beat
         drives (opacity only), zero pixi cost. */
      #loss-vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 52%,
          rgba(4, 2, 6, 0.92) 100%
        );
        opacity: 0;
        transition: opacity 0.45s ease;
        z-index: 5;
      }
      /* K834: while the intro loading animation runs its course (the
         viewer's "keep loading animation" switch OFF), no chrome shows:
         the settings panel and every other UI overlay wait for the
         intro to finish. With the switch ON the class is never added and
         the panel stays available over the permanent animation. main.ts
         owns the class. */
      html.km-intro .kp-menu,
      html.km-intro .kp-bar,
      html.km-intro .tp-dfwv,
      html.km-intro .km-hud,
      html.km-intro .km-banner,
      html.km-intro .km-mode,
      html.km-intro .km-undo,
      html.km-intro .km-pad,
      html.km-intro .km-control,
      html.km-intro .km-beat-paused-label {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="loss-vignette"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
