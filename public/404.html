<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Knotmaze</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #151a24;
        color: #c8cad3;
        font: 14px/1.5 system-ui, sans-serif;
      }
      main {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      a {
        color: #e7c56f;
      }
    </style>
    <script>
      // Knotmaze is ONE page, served at "/" (knotmaze.pages.dev) and at
      // "/knotmaze/" (levi.dev's proxy). Cloudflare Pages serves this file
      // for every other path (its presence turns off the SPA fallback,
      // which served the app under deep paths where its relative asset
      // URLs broke). Go to the app root, keeping the link's design token.
      (function () {
        var root = /^\/knotmaze(\/|$)/.test(location.pathname)
          ? "/knotmaze/"
          : "/";
        location.replace(root + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <main>
      <p>Taking you to <a href="https://levi.dev/knotmaze/">Knotmaze</a>…</p>
    </main>
  </body>
</html>
